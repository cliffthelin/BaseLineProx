[Unit]
# Proxmox's own state (/var/lib/pve-cluster, pve-firewall, pve-manager, rrdcached) is overlay data on USER_ADMIN (DR257, DR259).
# It is bound there by baseline-persist-bind-mounts.service, so no Proxmox service may start before that has finished: a start on the
# bare substrate would build a second, empty configuration there and leave SUBSTRATE holding personal data. Requires= makes it fail
# closed: if USER_ADMIN cannot be mounted, Proxmox stays down instead of running on an empty configuration.
Requires=baseline-persist-bind-mounts.service
After=baseline-persist-bind-mounts.service
