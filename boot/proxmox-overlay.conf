[Unit]
# Proxmox's own state (/var/lib/pve-cluster, pve-firewall, pve-manager, rrdcached) is overlay data on USER_ADMIN (DR257, DR259). It is bound
# there by baseline-persist-bind-mounts.service, so no Proxmox service may start before that has finished: a start on the bare substrate
# would build a second, empty configuration there.
# After= ONLY, deliberately not Requires=/Wants=: either would make a restart of pveproxy (baseline-proxmox-defaults does one during the
# first boot) start the redirect service mid-boot and move the live pmxcfs database. The redirects are in /etc/fstab once made, so later boots
# bind these directories before any of these services whether or not the redirect service runs; if USER_ADMIN cannot be mounted the boot
# fails at local-fs.target instead of starting Proxmox on an empty configuration.
After=baseline-persist-bind-mounts.service
