[workspace]
members = [
    "crates/guardian-core",
    "crates/guardian-provider-api",
    "crates/guardian-daemon",
    "crates/guardian-helper",
    "crates/guardian-testkit",
    "crates/guardian-client",
    "crates/guardian-cli",
    "crates/guardian-tui",
    "crates/guardian-gui",
    "crates/guardian-indicator",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
roxmltree = "0.20.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
zbus = { version = "5.12.0", features = ["blocking-api"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
