[workspace]

[package]
name = "g7-class-b-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "g7-class-b-daemon"
path = "src/daemon.rs"

[[bin]]
name = "g7-class-b-client"
path = "src/client.rs"

[dependencies]
guardian-core = { path = "../../../crates/guardian-core" }
guardian-provider-api = { path = "../../../crates/guardian-provider-api" }
zbus = { version = "5.12.0", features = ["blocking-api"] }
