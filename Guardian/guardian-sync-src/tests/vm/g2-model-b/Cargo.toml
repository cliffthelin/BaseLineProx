[workspace]

[package]
name = "g2-model-b-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "g2-model-b-core"
path = "src/core.rs"

[[bin]]
name = "g2-model-b-helper"
path = "src/helper.rs"

[[bin]]
name = "g2-model-b-client"
path = "src/client.rs"

[dependencies]
guardian-core = { path = "../../../crates/guardian-core" }
zbus = { version = "5.12.0", features = ["blocking-api"] }
