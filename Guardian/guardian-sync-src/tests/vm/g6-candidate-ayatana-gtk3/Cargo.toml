[workspace]

[package]
name = "g6-candidate-ayatana-gtk3"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "g6-candidate-ayatana-gtk3"
path = "src/main.rs"

[dependencies]
gtk = "0.15"
glib = "0.15"
gtk-sys = "0.15"
glib-sys = "0.15"
gobject-sys = "0.15"
zbus = { version = "5", features = ["blocking"] }

[build-dependencies]
pkg-config = "0.3"
