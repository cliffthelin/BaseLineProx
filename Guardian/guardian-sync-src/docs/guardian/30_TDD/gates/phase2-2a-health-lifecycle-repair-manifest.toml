# Guardian gate manifest — configuration only.
# Read alongside docs/guardian/30_TDD/GUARDIAN_EXECUTION_PROTOCOL.md.
# This file carries ownership/scope/evidence configuration for one gate;
# it is read directly by coding/review agents, not mechanically validated
# by tooling in this pass.
#
# This is a REOPENED-GATE REPAIR, not a new feature gate. Gate 2a
# (committed at 10a20abc5962ca15d8bccca731d226efd7ecea56, closed) predates
# the manifest system entirely — it was implemented and closed before
# manifests existed in this repository, so this file does not retroactively
# fabricate a full normal Gate 2a manifest as though one always existed.
# It exists only to govern this repair pass against two of Gate 2a's
# already-closed, already-normative IDs.

schema_version = 1
gate_id = "phase2-2a-health-lifecycle-repair"
kind = "reopened-gate-repair"
status = "not-started"

# The gate this repair reopens, and exactly which of its already-closed
# normative IDs are affected. This is NOT a new gate creating new IDs —
# P2-COR-003/P2-COR-004 are being repaired (their implementation and
# evidence corrected), not superseded, duplicated, or renumbered. All
# other 17 Gate 2a IDs (P2-EVT-001..004, P2-COR-001/002/005/006/007,
# P2-INC-002..004, P2-REC-001..005) are explicitly NOT reopened and must
# remain passing, unmodified in their own right, throughout this repair.
reopens_gate = "phase2-2a"
reopened_normative_ids = ["P2-COR-003", "P2-COR-004"]

# Commit this manifest was authored against. Confirmed via `git
# rev-parse HEAD` at authoring time; matches the task's stated baseline.
baseline_sha = "89ff50f0e0bcb7dcfc5df0438bddfe4e218219b7"

tdd_file = "docs/guardian/30_TDD/gates/phase2-2a-health-lifecycle-repair-tdd.md"

# The defect being repaired (see the linked TDD for full detail):
# `CorrelationEngine`'s dwell/debounce mechanism requires a *second*
# qualifying Event to promote a pending health candidate, but the real
# production producer (`HealthTransitionProducer`, Gate 2b) is
# edge-triggered and only ever supplies one Event per real state change —
# the real pipeline can never satisfy the promotion requirement for a
# capability that changes once and then stays changed. A related defect:
# `health_direction()` currently maps `Availability::Available`
# unconditionally to `Good` regardless of `Health`, actively
# misclassifying an `Available + Error` transition as a recovery signal
# today.
defect_summary = "Provider-health lifecycle cannot traverse sustained-bad-to-open or sustained-good-to-closed in the real production pipeline; health_direction() ignores Health entirely and misclassifies Available+Error as Good."

dependencies = ["phase2-2a"]

[allowed_scope]
paths = [
    "crates/guardian-core/src/correlation.rs",
    "crates/guardian-core/tests/correlation_contract.rs",
    "docs/guardian/30_TDD/gates/phase2-2a-health-lifecycle-repair-manifest.toml",
    "docs/guardian/30_TDD/gates/phase2-2a-health-lifecycle-repair-tdd.md",
    "docs/evidence/p2/**",
]

[forbidden_scope]
paths = [
    # Gate 2b's producer/daemon files. This repair fixes the engine-side
    # promotion semantics only; it does not touch the producer, the
    # daemon's fresh-snapshot-driven wiring, or Gate 2b's own tests. The
    # forward-pointer for Gate 2b's own downstream repair is recorded in
    # the linked TDD, not implemented here.
    "crates/guardian-core/src/providers/health.rs",
    "crates/guardian-daemon/**",
    "crates/guardian-daemon/tests/phase2_2b_contract.rs",
    # All Gate 2b governance files — unrelated scope, already closed.
    "docs/guardian/30_TDD/gates/phase2-2b-manifest.toml",
    "docs/guardian/30_TDD/gates/phase2-2b-tdd.md",
    # All Gate 2c files — parked, uncommitted, explicitly out of scope for
    # this task. Do not read, do not touch.
    "docs/guardian/30_TDD/gates/phase2-2c-manifest.toml",
    "docs/guardian/30_TDD/gates/phase2-2c-tdd.md",
    # Other unrelated crates.
    "crates/guardian-core/src/incident.rs",
    "crates/guardian-gui/**",
    "crates/guardian-tui/**",
    "crates/guardian-cli/**",
    "crates/guardian-indicator/**",
    "crates/guardian-helper/**",
]

required_test_layers = ["layer1"]

[validation_commands]
fmt = "cargo fmt --check"
clippy = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
test = "cargo test --workspace"
expected_baseline = "389 passed, 0 failed, 3 ignored (baseline_sha, before this repair's changes)"

required_evidence = [
    "docs/evidence/p2/ — P2-COR-003 repaired: a fresh, real-shaped snapshot re-observation (not a cloned/mutated synthetic second Event) advances a pending Bad candidate past dwell and opens exactly one Incident",
    "docs/evidence/p2/ — P2-COR-004 repaired: flapping faster than dwell still produces no thrashing under the corrected semantics",
    "docs/evidence/p2/ — symmetric recovery: a fresh re-observation advances a pending Good candidate past dwell and closes exactly one Incident, with no second Event manufactured",
    "docs/evidence/p2/ — health_direction() corrected: Available+Error no longer misclassifies as Good; full state table (see TDD) exercised",
    "Regression: all 19 Gate 2a normative IDs' existing tests in crates/guardian-core/tests/correlation_contract.rs still pass, including the 17 IDs not reopened by this repair",
]

commit_policy = "leave-uncommitted-for-independent-review"

# Recorded here as a forward pointer only — NOT implemented in this pass.
# After this Gate 2a repair is accepted and committed, Gate 2b requires
# its own separate, narrow repair (see the linked TDD's "Downstream Gate
# 2b repair" section for full detail: complete Availability+Health
# provenance on the health-transition Event; wiring the daemon's
# fresh-snapshot-driven dwell-advance call into capability_registry_tick;
# replacing P2-API-001's synthetic cloned-second-event fixture with one
# driving the real production sequence, symmetrically for both open and
# close).
next_gate = "phase2-2b-health-lifecycle-repair (not yet created)"
