# Guardian gate manifest — configuration only.
# Read alongside docs/guardian/30_TDD/GUARDIAN_EXECUTION_PROTOCOL.md.
# This file carries ownership/scope/evidence configuration for one gate;
# it is read directly by coding/review agents, not mechanically validated
# by tooling in this pass.
#
# This is a REOPENED-GATE REPAIR, not a new feature gate. Gate 2b
# (baseline_sha 10a20abc5962ca15d8bccca731d226efd7ecea56, closed) already
# owns P2-API-001..003. This file does not retroactively rewrite Gate 2b's
# own manifest/TDD (docs/guardian/30_TDD/gates/phase2-2b-manifest.toml /
# phase2-2b-tdd.md are left exactly as committed) — it layers a narrow
# repair alongside them, exactly the pattern the just-committed Gate 2a
# health-lifecycle repair (docs/guardian/30_TDD/gates/
# phase2-2a-health-lifecycle-repair-manifest.toml) already used for Gate
# 2a. It exists to close the "Downstream Gate 2b repair" forward pointer
# that Gate 2a repair's own TDD recorded and explicitly declined to
# implement.

schema_version = 1
gate_id = "phase2-2b-health-lifecycle-integration-repair"
kind = "reopened-gate-repair"
status = "not-started"

# The gate this repair reopens, and exactly which of its already-closed
# normative IDs are affected. This is NOT a new gate creating new IDs.
# P2-API-001 is being repaired (its acceptance evidence corrected to prove
# the real production integration path instead of a synthetic
# cloned-second-event fixture) — not superseded, duplicated, or
# renumbered. P2-API-002 (no new public D-Bus surface) and P2-API-003
# (IncidentWire shape-lock) are explicitly NOT reopened: this repair adds
# no D-Bus member and does not touch IncidentWire's shape, so neither ID's
# existing evidence requires re-verification beyond continuing to pass
# unmodified.
reopens_gate = "phase2-2b"
reopened_normative_ids = ["P2-API-001"]

# Commit this manifest was authored against. Confirmed via `git
# rev-parse HEAD` at authoring time; matches the task's stated baseline.
baseline_sha = "0d071e194c353ffb42afd566be958a2a40925cd0"

tdd_file = "docs/guardian/30_TDD/gates/phase2-2b-health-lifecycle-integration-repair-tdd.md"

# The defect being repaired (see the linked TDD for full detail): Gate 2b's
# own P2-API-001 evidence (crates/guardian-daemon/tests/
# phase2_2b_contract.rs's build_engine_with_one_real_open_incident) proves
# Incidents1.ListIncidents() returns a real incident only by cloning the
# one real Event HealthTransitionProducer ever emits and mutating the
# clone's event_id to fabricate a fake second admission -- exactly the
# capability the just-committed Gate 2a health-lifecycle repair
# (advance_health_dwell / FreshHealthObservation) added specifically so
# production would never need to do this. No real capability_registry_tick
# sequence today calls advance_health_dwell at all: the daemon-side wiring
# gap this repair closes. A related, narrower defect: the health-transition
# Event's own provenance is incomplete for the correlation engine's
# existing classify() step -- HealthTransitionProducer's transition_event
# only ever populates HEALTH_AVAILABILITY_TO_ATTR, never
# HEALTH_HEALTH_TO_ATTR, so every real Event's Health dimension is silently
# defaulted to Health::Healthy by classify() rather than carrying the real
# observed value.
defect_summary = "P2-API-001's acceptance evidence proves only a synthetic cloned-second-event admission, not the real production path; capability_registry_tick never calls Gate 2a's fresh-observation dwell-advance entry point; HealthTransitionProducer never emits the Health dimension of a transition, only Availability."

dependencies = ["phase2-2a", "phase2-2a-health-lifecycle-repair", "phase2-2b"]

[allowed_scope]
paths = [
    "crates/guardian-core/src/providers/health.rs",
    "crates/guardian-daemon/**",
    "docs/guardian/30_TDD/gates/phase2-2b-health-lifecycle-integration-repair-manifest.toml",
    "docs/guardian/30_TDD/gates/phase2-2b-health-lifecycle-integration-repair-tdd.md",
    "docs/evidence/p2/**",
]

[forbidden_scope]
paths = [
    # Gate 2a's own files. This repair depends on Gate 2a's already-closed
    # API (advance_health_dwell / health_direction / HealthDirection::
    # Bad(Confidence) / DebounceCandidate / FreshHealthObservation) but
    # must consume it as-is -- it does not get to change Gate 2a's engine
    # semantics to make its own job easier. Forbidden even though this
    # repair depends on their API.
    "crates/guardian-core/src/correlation.rs",
    "crates/guardian-core/tests/correlation_contract.rs",
    # Gate 2a's reopened-repair envelope -- unrelated scope, already
    # committed and closed.
    "docs/guardian/30_TDD/gates/phase2-2a-health-lifecycle-repair-manifest.toml",
    "docs/guardian/30_TDD/gates/phase2-2a-health-lifecycle-repair-tdd.md",
    # Gate 2c files -- parked, uncommitted local work, explicitly out of
    # scope for this task. Do not read beyond `git status`, do not touch.
    "docs/guardian/30_TDD/gates/phase2-2c-manifest.toml",
    "docs/guardian/30_TDD/gates/phase2-2c-tdd.md",
    # Gate 2b's own closed manifest/TDD -- this repair is a separate,
    # layered envelope; it does not rewrite them.
    "docs/guardian/30_TDD/gates/phase2-2b-manifest.toml",
    "docs/guardian/30_TDD/gates/phase2-2b-tdd.md",
    # IncidentWire's wire shape itself is frozen (TDD contract §51;
    # implementation handoff §15/§20; P2-API-003, not reopened here).
    # Gate 2b already populates it; this repair may continue populating it
    # but must not change its shape.
    "crates/guardian-daemon/src/dbus_surface.rs::IncidentWire-shape",
    "crates/guardian-client/src/lib.rs::IncidentWire-shape",
    # Wave 1 production-mutation files and other gates' owned modules --
    # unrelated scope.
    "crates/guardian-daemon/src/restart_capability.rs",
    "crates/guardian-helper/**",
    "crates/guardian-gui/**",
    "crates/guardian-tui/**",
    "crates/guardian-cli/**",
    "crates/guardian-indicator/**",
]

required_test_layers = ["layer1", "layer2"]

[validation_commands]
fmt = "cargo fmt --check"
clippy = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
test = "cargo test --workspace"
expected_baseline = "400 passed, 0 failed, 3 ignored (baseline_sha, before this repair's changes)"

required_evidence = [
    "docs/evidence/p2/ — Event provenance: HealthTransitionProducer's transition_event carries both HEALTH_AVAILABILITY_TO_ATTR and HEALTH_HEALTH_TO_ATTR for every real transition, reconstructing the exact governed confidence tier via classify()/health_direction() without defaulting Health away; unchanged_snapshot_pair_emits_no_event (or equivalent) still asserts zero Events for an unchanged pair",
    "docs/evidence/p2/ — capability_registry_tick calls Gate 2a's fresh-observation dwell-advance entry point once per tick, per capability in the fresh snapshot, after admitting any real diff-driven Events, using the same snapshot already collected (no extra provider read)",
    "docs/evidence/p2/ — P2-API-001 repaired: build_engine_with_one_real_open_incident (or its replacement) drives the real production sequence only -- no cloned/mutated Event -- and ListIncidents() returns the real opened incident",
    "docs/evidence/p2/ — symmetric recovery: the same real-sequence integration test (or a sibling) proves sustained-bad-to-open followed by sustained-good-to-close, both via fresh-snapshot advancement, no second Event manufactured in either direction",
    "Regression: P2-API-002 (no new D-Bus surface) and P2-API-003 (IncidentWire shape-lock) evidence in crates/guardian-daemon/tests/phase2_2b_contract.rs continues to pass unmodified",
]

commit_policy = "leave-uncommitted-for-independent-review"
