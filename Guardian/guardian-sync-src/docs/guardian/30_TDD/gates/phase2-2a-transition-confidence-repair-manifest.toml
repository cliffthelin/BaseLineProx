commit_policy = "leave-uncommitted-for-independent-review"

# Recorded here as a forward pointer only — NOT implemented in this pass.
# After this Gate 2a repair is accepted and committed, Gate 2b requires its
# own separate, narrow repair (see the linked TDD's "Downstream Gate 2b
